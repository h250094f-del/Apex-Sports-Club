services:
  - type: web
    name: apex-sports-club
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 80
      - key: DATABASE_URL
        fromDatabase:
          name: apex-db
          property: connectionString

databases:
  - name: apex-db
    plan: free
    region: oregon
    databaseName: apex_sports
    user: apex_user
